<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body><div class="screen white">

  <div class="card lime" style="padding:22px 20px;">
    <span class="cat-badge">● MOJA · 자립준비청년 지원 안내</span>
    <h1 class="q" style="font-size:27px;">받을 수 있는 지원,<br>놓치지 않도록.</h1>
    <p class="hint" style="color:#2C3A00;">보호가 끝난 뒤 <b>5년</b>이 지원 기한인 제도가 많아요.<br>모자가 남은 기한부터 챙겨서 알려드려요.</p>
    <div class="choice-row" style="margin-top:18px;">
      <button class="btn sub" style="flex:1;">로그인 없이 시작</button>
      <button class="btn sub ghost" style="flex:1;">1분 진단 →</button>
    </div>
  </div>

  <div class="sec-title">계정 만들기 <span style="font-weight:500;color:#9CA3AF;font-size:12px;">(선택)</span></div>
  <div class="field"><input placeholder="닉네임 — 커뮤니티에 표시될 이름"></div>
  <div class="field"><input placeholder="이메일"></div>
  <p style="font-size:11.5px;color:#6B7280;line-height:1.6;">실명·연락처는 받지 않아요. 닉네임만 있으면 돼요.</p>

  <div class="card lime" style="margin-top:16px;padding:16px 18px;">
    <span class="cat-badge" style="font-size:11px;">● 안내</span>
    <div style="font-size:15px;font-weight:800;margin-top:2px;">이메일을 꼭 확인해 주세요</div>
    <p class="hint" style="margin-top:8px;color:#2C3A00;">비밀번호를 잊으면 이 주소로만 복구할 수 있어요.<br>계정 없이도 진단은 그대로 이용할 수 있어요.</p>
  </div>

  <button class="btn" style="margin-top:18px;">시작하기 →</button>
  <p class="foot" style="text-align:center;">소셜 로그인은 준비 중이에요 · 온보딩 답변은 이 기기에만 저장돼요</p>

</div></body></html>
